name: Run SUMO with dynamic config

on:
  pull_request:
    branches: [main]

env:
  SUMO_CFG_FILE: reutlingen.sumocfg

jobs:
  test-sumo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Install SUMO
        run: |
          sudo apt-get update
          sudo apt-get install -y sumo sumo-tools

      - name: Set SUMO_HOME
        run: echo "SUMO_HOME=$(dirname $(which sumo))/../share/sumo" >> $GITHUB_ENV

      - name: Find all .sumocfg files and test them
        run: |
          set -e  # fail fast on error
          for f in $(find . -name '*.sumocfg'); do
            echo "============================================="
            echo "Testing SUMO config: $f"
            echo "============================================="
            
            # Go into the directory of the .sumocfg so relative paths work
            cfg_dir=$(dirname "$f")
            cfg_file=$(basename "$f")
            pushd "$cfg_dir" > /dev/null

            # Run SUMO
            sumo -c "$cfg_file" --duration-log.statistics --no-warnings true

            popd > /dev/null
            echo "$f finished successfully"
          done
