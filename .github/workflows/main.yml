name: Run SUMO with dynamic config

on:
  pull_request:
    branches: [main]

env:
  SUMO_CFG_FILE: reutlingen.sumocfg  # change for execution of different sumocfg

jobs:
  test-sumo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Install SUMO
        run: |
          sudo apt-get update
          sudo apt-get install -y sumo sumo-tools

      - name: Find all .sumocfg files and test them
        run: |
          for f in $(find . -name '*.sumocfg'); do
            echo "Testing $f"
            sumo -c "$f" --duration-log.statistics --no-warnings true
          done

