<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Biflex Static + WebSocket</title>

    <link rel="shortcut icon" type="image/x-icon" href="/webWizard_example/images/favicon.ico" />

    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />

    <!-- Local styles -->
    <link rel="stylesheet" href="/webWizard_example/style.css" onerror="this.remove();" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="map"></div>
    <canvas id="selectionCanvas" style="display:none"></canvas>

    <div id="side">
      <div id="tabs">
        <div class="tab" title="Options"><img src="/webWizard_example/images/generate.png" /></div>
        <div class="tab" title="Vehicles"><img src="/webWizard_example/images/passenger.png" /></div>
        <div class="tab" title="Road-Types"><img src="/webWizard_example/images/road.png" /></div>
        <div class="tab" title="Copyright">c</div>
      </div>

      <div class="controls">
        <div class="container">
          <h4>Position</h4>
          <div class="options open">
            <p>
              <input id="address" value="Berlin" size="18" />
              <input id="buttonSearch" type="button" value="Search" />
            </p>
            <p>
              <input id="lat_lon" value="52.52 13.4" size="18" />
              <input id="buttonLatLon" type="button" value="Go to" />
            </p>
            <p>
              <input id="buttonCurrent" type="button" value="Use current location" />
            </p>
          </div>
        </div>

        <div class="container">
          <div class="options open">
            <label>Select Area <input type="checkbox" id="canvas-toggle" /></label>
            <div style="margin-top:6px">
              <input id="scenario" placeholder="Scenario name (optional)" />
              <div style="color:#ddd; font-size:.9em; margin-top:4px">
                Selected bbox: <code id="bbox">none</code>
              </div>
            </div>
          </div>
        </div>

        <div class="container" style="margin-top: 20px;">
          <h4>Options</h4>
          <div class="options open" id="general-options">
            <label>Duration <input id="duration" type="number" value="3600" min="0" step="1" style="float:none" /></label>
            <label>Left Hand Traffic <input id="leftHand" type="checkbox" /></label>
            <label>Satellite background <input id="decal" type="checkbox" /></label>
          </div>
        </div>

        <div class="container">
          <h4>Build</h4>
          <div id="commands">
            <button id="sendLocal">Send to Local SUMO</button>
            <button id="copyBash">Copy Bash</button>
            <button id="copyPowershell">Copy PowerShell</button>
          </div>
          <div id="buildStatus"></div>
        </div>

        <div class="container">
          <h4>Simulation</h4>
          <div id="commands">
            <button id="generateTrips">Generate Trips</button>
            <button id="startSimulation">Start Simulation</button>
          </div>
          <div id="simStatus"></div>
        </div>

        <div class="container">
          <h4>Developer</h4>
          <div id="commands">
            <button id="downloadOSMData">Generate Scenario</button>
          </div>
          <div id="devKitContainer"></div>
        </div>

      </div>

      <div class="controls" id="vehicle-controls">
        <div class="container">
          <h4>Vehicles</h4>
          <div class="options open">
            <p style="margin:6px;color:#ddd">Prototype: configure later.</p>
          </div>
        </div>
      </div>

      <div class="controls" id="road-types">
        <div class="container">
          <h4>Road-Types</h4>
          <div class="options open">
            <p style="margin:6px;color:#ddd">Prototype: configure later.</p>
          </div>
        </div>
      </div>

      <div class="controls">
        <div class="container">
          <h4>Icon Copyrights</h4>
          <div class="images">
            <img src="/webWizard_example/images/generate.png" />
            <img src="/webWizard_example/images/passenger.png" />
            <img src="/webWizard_example/images/truck.png" />
            <img src="/webWizard_example/images/bicycle.png" />
          </div>
          <p>Icons by Google Design (CC-BY-SA)</p>
        </div>
      </div>

      <div id="fixed">
        <button id="export-button">Generate Scenario</button>
        <div id="status"><span></span><div></div></div>
      </div>
    </div>

    <div id="footer">
      <h3>WebSocket Console</h3>
      <div class="row">
        <input id="msg" placeholder="Type a message" />
        <button id="send">Send</button>
        <button id="ping">Ping</button>
        <button id="clear">Clear Log</button>
      </div>
      <div id="wsStatus">Connecting...</div>
      <div id="log"></div>
    </div>

    <!-- Leaflet JS -->
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>

    <!-- Your external script -->
    <script src="/script.js"></script>
  </body>
</html>
